name: Validate build inputs

on:
  pull_request:
    paths:
      - 'build.sh'
      - 'cage_xtmapper.sh'
      - 'forks/**'
      - '.gitmodules'
      - 'wlroots_deps/**'
      - 'meson_wrapfiles/**'
      - 'tests/**'
      - 'SHA256SUMS'
      - '.github/workflows/**'
  push:
    paths:
      - 'build.sh'
      - 'cage_xtmapper.sh'
      - 'forks/**'
      - '.gitmodules'
      - 'wlroots_deps/**'
      - 'meson_wrapfiles/**'
      - 'tests/**'
      - 'SHA256SUMS'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify vendored dependency archives
        run: sha256sum --check SHA256SUMS

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check shell syntax and style
        run: |
          bash -n build.sh cage_xtmapper.sh tests/*.sh
          shellcheck build.sh cage_xtmapper.sh tests/*.sh

      - name: Run mocked build and launcher checks
        run: |
          bash tests/test-build.sh
          bash tests/test-launcher.sh
