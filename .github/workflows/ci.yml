name: Validate build inputs

on:
  pull_request:
    paths:
      - 'build.sh'
      - 'install_deps.sh'
      - 'cage_xtmapper.sh'
      - 'forks/**'
      - '.gitmodules'
      - 'wlroots_deps/**'
      - 'meson_wrapfiles/**'
      - 'tests/**'
      - 'SHA256SUMS'
      - '.github/workflows/**'
  push:
    paths:
      - 'build.sh'
      - 'install_deps.sh'
      - 'cage_xtmapper.sh'
      - 'forks/**'
      - '.gitmodules'
      - 'wlroots_deps/**'
      - 'meson_wrapfiles/**'
      - 'tests/**'
      - 'SHA256SUMS'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo ./install_deps.sh
          sudo apt-get install --yes shellcheck

      - name: Verify vendored dependency archives
        run: sha256sum --check SHA256SUMS

      - name: Check shell syntax and style
        run: |
          bash -n build.sh install_deps.sh cage_xtmapper.sh tests/*.sh
          shellcheck build.sh install_deps.sh cage_xtmapper.sh tests/*.sh

      - name: Run mocked installer, build, and launcher checks
        run: |
          bash tests/test-install-deps.sh
          bash tests/test-build.sh
          bash tests/test-launcher.sh

      - name: Compile Cage and wlroots
        run: ./build.sh
