name: Package v0.2.0 release

on:
  push:
    paths:
      - '**.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: ./install_deps.sh

      - name: Build
        run: ./build.sh

      - name: Package versioned archive
        run: tar -C build/installed -pcf "cage-xtmapper-v0.2.0.tar" usr

      - name: Attach archive to the matching release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v20261019
          files: cage-xtmapper-v0.2.0.tar
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: false
