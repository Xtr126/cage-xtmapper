name: Build cage

on:
  workflow_dispatch:
  push:
    paths:
      - '**.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Prepare environment
      run: |
        sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        sudo sed -i 's/noble/plucky/g' /etc/apt/sources.list
        sudo sed -i 's/noble/plucky/g' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt update
        sudo apt build-dep wlroots -y

    - uses: actions/checkout@v4

    - name: Execute build script
      run: ./build.sh

    - name: Package into tarball
      working-directory: ./build/installed
      run: tar pcf cage-xtmapper-v0.2.0.tar usr
        
    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: './build/installed/cage-xtmapper-v0.2.0.tar'
        tag: latest
        overwrite: true
        file_glob: true          
        draft: true
